name: traefik-proxy
services:
- name: traefik
  github:
    branch: main
    deploy_on_push: true
    repo: Indiazona/traefik
  dockerfile_path: Dockerfile
  http_port: 80
  instance_count: 1
  instance_size_slug: basic-xxs
  routes:
  - path: /
  envs:
  - key: DO_ACCESS_TOKEN
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: DOMAIN_NAME
    value: traefik.indiazona.in
    scope: RUN_AND_BUILD_TIME
    type: SECRET 